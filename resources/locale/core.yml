    # Translations in this namespace are displayed in the basic HTML discussion view.
    discussion:
      next_page_button: => core.ref.next_page
      previous_page_button: => core.ref.previous_page

    # Translations in this namespace are displayed by the basic HTML discussion index.
    index:
      all_discussions_heading: => core.ref.all_discussions
      next_page_button: => core.ref.next_page
      previous_page_button: => core.ref.previous_page

    # Translations in this namespace are displayed by the Log Out confirmation interface.
    log_out:
      log_out_button: => core.ref.log_out
      log_out_confirmation: "确定要退出 {forum}？"
      title: => core.ref.log_out

  # Translations in this namespace are used by the HTTP API.
  api:
    invalid_username_message: "用户名只能包含字母、数字和短横线"

  # Translations in this namespace are used in emails.
  email:

    # These translations are used in emails sent when users register new accounts.
    activate_account:
      subject: 激活账号
      body: |
        嗨，{username}！

        有人（希望是你本人！）在 {forum} 使用此邮箱地址注册了账号。

        如果是你，请点击以下链接激活账号：
        {url}

        如果这不是你本人的操作，请忽略此邮件。

    # These translations are used in emails sent when users change their email address.
    confirm_email:
      subject: 确认新邮箱地址
      body: |
        嗨，{username}！

        有人（希望是你本人！）在 {forum} 将账号的邮箱地址改为此邮箱。

        如果是你，请点击以下链接确认邮箱：
        {url}

        如果这不是你本人的操作，请忽略此邮件。

    # These translations are used in emails sent when users ask to reset their passwords.
    reset_password:
      subject: => core.ref.reset_your_password
      body: |
        嗨，{username}！

        有人（希望是你本人！）在 {forum} 请求重置密码。

        如果是你，请点击以下链接重置密码：
        {url}

        如果你不想修改密码，请忽略此邮件，我们不会更改你的密码。

    # These translations are used in emails sent to e.g. test email configuration.
    send_test:
      subject: Flarum 邮件测试
      body: |
        嗨，{username}！

        这是一封用于确认 Flarum 论坛邮件功能正常的测试邮件。

        如果不是你发起的测试，请忽略此邮件。

    # These translations are used in the email that is sent to a user when someone
    # else replies to a post in a discussion they are following
    new_post:
      subject: "[回复] {title}"
      body: |
        嗨，{recipient_display_name}！

        {replier_display_name} 在帖子「{title}」中发表了回复：

        {content}

        点击此链接查看完整帖子：
        {url}

        ---

        - {forum}

