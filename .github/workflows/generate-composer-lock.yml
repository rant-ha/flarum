# Add this file via GitHub: Add file -> Create new file -> paste -> Commit
name: Generate composer.lock

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, pdo, pdo_mysql, json
          coverage: none

      - name: Ensure composer available
        run: composer --version

      - name: Ensure composer.lock is not ignored
        run: |
          if [ -f .gitignore ] && grep -q '^composer.lock$' .gitignore; then
            echo "composer.lock found in .gitignore — removing it"
            # remove the exact line 'composer.lock' from .gitignore
            sed -i '/^composer.lock$/d' .gitignore || true
            git add .gitignore
            git commit -m "chore: remove composer.lock from .gitignore" || echo "no change to .gitignore"
            git push || echo "push failed (might be no permission)"
          else
            echo "composer.lock not in .gitignore or no .gitignore present"
          fi

      - name: Generate composer.lock (composer update)
        run: |
          composer update --no-interaction --prefer-dist --optimize-autoloader

      - name: Commit and push composer.lock if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          if git status --porcelain | grep -q "composer.lock"; then
            git add composer.lock
            git commit -m "chore: add composer.lock generated by GitHub Actions [skip ci]" || echo "commit failed"
            git push origin HEAD:$GITHUB_REF_NAME || git push
            echo "composer.lock pushed"
          else
            echo "No changes to composer.lock"
          fi
