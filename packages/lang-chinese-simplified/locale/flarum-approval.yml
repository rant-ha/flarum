flarum-approval:

  forum:
    badge:
      awaiting_approval_tooltip: 待审核

  admin:
    permissions:
      approve_posts_label: 批准帖子
      bypass_approval_label: 跳过审核
      start_discussions_require_approval_label: 发帖需审核
      reply_require_approval_label: 回复需审核

  email:
    post_approved:
      subject: "[审核通过] 您的回复已获批准"
      body: |
        嗨，{recipient_display_name}！

        您在帖子「{title}」中的回复已获批准。

        点击此链接查看：
        {url}

        ---

        - {forum}
